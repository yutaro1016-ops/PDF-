name: Import PDF page finder

on:
  push:
    paths:
      - .github/workflows/import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the published app assets
        run: |
          python3 - <<'PY'
          import hashlib
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          origin = "https://pdf-page-finder-yutaro.yutaro1016.chatgpt.site/"
          records = []
          for line in Path("import-manifest.txt").read_text().splitlines():
              expected, path = line.split("  ", 1)
              if path != "index.html":\n                  records.append((expected, path))

          def fetch(record):
              expected, path = record
              url = origin + quote(path, safe="/")
              request = Request(url, headers={"User-Agent": "PDF-page-finder-source-import/1.0"})
              with urlopen(request, timeout=30) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise ValueError(f"SHA-256 mismatch: {path}; got {actual}; bytes {len(data)}; start {data[:120]!r}")
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              return path

          with ThreadPoolExecutor(max_workers=8) as pool:
              imported = list(pool.map(fetch, records))
          print(f"Verified {len(imported)} files")
          PY
      - name: Commit verified source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css vendor
          git commit -m "Add complete PDF page finder application"
          git push
