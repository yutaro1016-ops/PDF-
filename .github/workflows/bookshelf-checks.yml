name: Bookshelf checks
on:
  push:
    branches: [feature/digital-bookshelves]
  pull_request:
    paths:
      - 'bookshelf/**'
      - '.github/workflows/bookshelf-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 bookshelf/tests/migration_test.py
      - run: node --check bookshelf/public/app.js
      - run: node bookshelf/tests/color_presets_test.mjs
      - run: node bookshelf/tests/thumbnail_test.mjs
      - run: npm install --prefix /tmp/sharing-test-tools --ignore-scripts typescript@5.9.3
      - run: node bookshelf/tests/sharing_test.mjs
        env:
          NODE_PATH: /tmp/sharing-test-tools/node_modules
